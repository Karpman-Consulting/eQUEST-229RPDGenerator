on: pull_request

jobs:

  black-formatting-check:
    name: Black Formatting Check
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv Virtualenv
        uses: actions/cache@v4
        id: cache-uv-black
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Dependencies (No Project Install)
        if: steps.cache-uv-black.outputs.cache-hit != 'true'
        run: uv sync --frozen --no-install-project

      - name: Run Black
        run: uv run black --check .


  run-tests:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv Virtualenv
        uses: actions/cache@v4
        id: cache-uv-tests
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Project and Dependencies
        if: steps.cache-uv-tests.outputs.cache-hit != 'true'
        run: uv sync --frozen

      - name: Run Unit Tests
        run: uv run pytest -q
