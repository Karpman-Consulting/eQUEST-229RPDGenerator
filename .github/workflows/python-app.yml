on: pull_request

jobs:

  black-formatting-check:
    name: Black Formatting Check
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Add Poetry to PATH (Windows runner)
        shell: pwsh
        run: |
          $paths = @(
            "$env:APPDATA\Python\Scripts",
            "$env:USERPROFILE\.poetry\bin"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Adding $p to PATH"
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Cache Poetry Virtualenv
        uses: actions/cache@v4
        id: cache-poetry-black
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies (No Root Package)
        if: steps.cache-poetry-black.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run Black
        run: poetry run black --check .


  run-tests:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Add Poetry to PATH (Windows runner)
        shell: pwsh
        run: |
          $paths = @(
            "$env:APPDATA\Python\Scripts",
            "$env:USERPROFILE\.poetry\bin"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Adding $p to PATH"
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Cache Poetry Virtualenv
        uses: actions/cache@v4
        id: cache-poetry-tests
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies (No Root Package)
        if: steps.cache-poetry-tests.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install Project (editable)
        run: poetry install --no-interaction

      - name: Run Unit Tests
        run: poetry run pytest -q
