[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equest-rct-toolkit"
version = "0.1.0"
description = "Compliance wizard for generating and validating ASHRAE 229 RPD files from eQUEST/DOE-2 models."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
  { name = "Jackson Jarboe", email = "122476654+JacksonJ-KC@users.noreply.github.com" },
]
license = { file = "LICENSE" }
dependencies = [
  "customtkinter>=5.2.2,<6.0.0",
  "pillow>=12.3.0,<13.0.0",
  "tksheet>=7.5.17,<8.0.0",
  "pint>=0.23,<0.24",
  "jsonschema>=4.25.1,<5.0.0",
  "jsonpath-ng>=1.7.0,<2.0.0",
  "ctktooltip>=0.8,<0.9",
  "pydash>=7.0.7,<8.0.0",
  "numpy>=1.26.4,<2.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "ruleset-checking-tool",
  "rctreportviewer",
]

[project.urls]
Repository = "https://github.com/Karpman-Consulting/eQUEST-229RPDGenerator"

[dependency-groups]
dev = [
  "black>=26.3.1,<27.0.0",
  "pre-commit>=4.4.0,<5.0.0",
  "pygments>=2.20.0,<3.0.0",
  "pytest>=9.0.3,<10.0.0",
  "rpdvalidator>=1.1.1,<2.0.0",
  "xlsxwriter>=3.2.9,<4.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpd_generator*", "interface*", "test*"]
exclude = ["*.egg-info*", "__pycache__*"]

[tool.uv.sources]
rctreportviewer = { git = "https://github.com/Karpman-Consulting/RECI-ReportProjectEval.git", branch = "main" }
ruleset-checking-tool = { git = "https://github.com/pnnl/ruleset-checking-tool.git", branch = "develop" }

[tool.uv]
override-dependencies = [
  "black>=26.3.1,<27.0.0",
]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = [
  "python32",
  "dist",
  "build",
  "installer",
  "documentation",
  "dev_utils",
  "workers_x86",
  ".venv",
  ".git",
]
addopts = [
  "--ignore=python32/Lib",
  "--ignore=python32/Lib/site-packages",
]
